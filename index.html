<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>Simple To-Do List App</title>
    </head>
    <body>
        <h1>To-Do List</h1>

        <input type="text" id="taskInput" placeholder="Enter a task">
        <button id="addButton">Add Task</button>

        <p>Total Tasks: <span id="taskCount">0</span></p>

        <ul id="taskList"></ul>

        <script src="script.js"></script>
    </body>
</html>
